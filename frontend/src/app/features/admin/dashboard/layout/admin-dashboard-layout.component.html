<app-site-layout
  [showFriendSearch]="false"
  brandRoute="/dashboard"
  primaryLinkLabel="Dashboard"
  primaryLinkRoute="/dashboard"
  secondaryLinkLabel="Home"
  secondaryLinkRoute="/"
  profileRoute="/dashboard/profile"
>
  <section class="dashboard-shell">
    <aside class="dashboard-sidebar">
      <p class="dashboard-sidebar-eyebrow">Management</p>
      <h1>Control Panel</h1>

      <nav class="dashboard-menu">
        @for (item of menuItems; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
            class="dashboard-menu-item"
          >
            {{ item.label }}
          </a>
        }
      </nav>
    </aside>

    <section class="dashboard-content">
      <router-outlet />
    </section>
  </section>
</app-site-layout>
